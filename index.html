<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fc" />
  <title>Việc của tôi — Quản lý công việc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>" />
  <style>
    :root {
      --bg: #f4f6fc;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-soft: #1e293b;
      --muted: #64748b;
      --muted-soft: #94a3b8;
      --line: #e6eaf2;
      --line-soft: #edf0f7;
      --brand: #4f46e5;
      --brand-2: #7c3aed;
      --green: #059669;
      --green-bright: #10b981;
      --danger: #e11d48;
      --shadow-lg: 0 20px 50px -20px rgba(15, 23, 42, 0.28);
      --shadow-md: 0 12px 30px -18px rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px 56px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 8% -12%, #e0e7ff 0%, rgba(224, 231, 255, 0) 62%),
        radial-gradient(820px 520px at 108% 2%, #ede9fe 0%, rgba(237, 233, 254, 0) 58%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font-family: inherit; }

    [hidden] { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    /* ---------- Hero ---------- */
    .hero { margin-bottom: 22px; }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      flex: none;
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      color: #fff;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 12px 26px -10px rgba(79, 70, 229, 0.75);
    }

    .eyebrow {
      margin: 0 0 3px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .subtitle {
      margin: 14px 0 0;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--muted);
    }

    /* ---------- Thống kê ---------- */
    .stats {
      margin-top: 20px;
      padding: 18px 20px 20px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .stats-row {
      display: flex;
      align-items: stretch;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .stat--done .stat-value { color: var(--green); }

    .stat--percent .stat-value {
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-soft);
    }

    .stat-divider {
      width: 1px;
      margin: 4px 2px;
      background: var(--line);
    }

    .progress-track {
      height: 8px;
      margin-top: 16px;
      overflow: hidden;
      background: #eef1f8;
      border-radius: 999px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------- Thêm việc ---------- */
    .add-form {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .add-form:focus-within {
      border-color: #c7c9f8;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1), var(--shadow-md);
    }

    .add-form.shake {
      border-color: #fecdd3;
      animation: shake 0.35s ease;
    }

    .add-input {
      flex: 1;
      min-width: 0;
      padding: 12px 6px 12px 12px;
      font-size: 16px;
      color: var(--ink);
      background: transparent;
      border: none;
      outline: none;
    }

    .add-input::placeholder { color: var(--muted-soft); }

    .add-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      padding: 0 18px;
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.9);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    .add-btn svg { flex: none; }

    .add-btn:hover { filter: brightness(1.08); }

    .add-btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 5px 12px -6px rgba(79, 70, 229, 0.9);
    }

    /* ---------- Tìm kiếm ---------- */
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 8px 10px 8px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      border-color: #c7c9f8;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1), var(--shadow-md);
    }

    .search-icon {
      flex: none;
      color: var(--muted-soft);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 0;
      font-size: 16px;
      color: var(--ink);
      background: transparent;
      border: none;
      outline: none;
    }

    .search-input::placeholder { color: var(--muted-soft); }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .search-clear {
      flex: none;
      width: 30px;
      height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
      background: #eef1f8;
      border: none;
      border-radius: 50%;
      transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .search-clear:hover {
      color: var(--ink);
      background: #e2e8f0;
    }

    .search-clear:active { transform: scale(0.94); }

    .search-clear svg { flex: none; }

    /* ---------- Thanh công cụ ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .filters {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .filter-btn:hover { color: var(--ink); }

    .filter-btn[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 8px 16px -9px rgba(79, 70, 229, 0.9);
    }

    .filter-count {
      min-width: 20px;
      padding: 1px 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
      background: #eef1f8;
      border-radius: 999px;
    }

    .filter-btn[aria-pressed="true"] .filter-count {
      color: #fff;
      background: rgba(255, 255, 255, 0.24);
    }

    .clear-btn {
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted-soft);
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s ease;
    }

    .clear-btn:hover { color: var(--danger); }

    /* ---------- Danh sách ---------- */
    .task-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: var(--card);
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      box-shadow: 0 2px 10px -7px rgba(15, 23, 42, 0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .task.is-new { animation: taskIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .task.is-removing {
      pointer-events: none;
      animation: taskOut 0.18s ease forwards;
    }

    @media (hover: hover) {
      .task:hover {
        border-color: #d8def0;
        box-shadow: 0 10px 22px -16px rgba(15, 23, 42, 0.4);
        transform: translateY(-1px);
      }
    }

    .check {
      flex: none;
      width: 27px;
      height: 27px;
      padding: 0;
      display: grid;
      place-items: center;
      color: transparent;
      cursor: pointer;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .check:hover {
      color: rgba(5, 150, 105, 0.35);
      border-color: var(--green-bright);
    }

    .check:active { transform: scale(0.9); }

    .check svg {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.15s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .is-done .check {
      color: #fff;
      background: linear-gradient(135deg, var(--green-bright), var(--green));
      border-color: transparent;
      box-shadow: 0 5px 12px -6px rgba(5, 150, 105, 0.9);
    }

    .is-done .check svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-text {
      min-width: 0;
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
      transition: color 0.2s ease;
    }

    .is-done .task-text {
      color: var(--muted-soft);
      text-decoration: line-through;
      text-decoration-color: #cbd5e1;
      text-decoration-thickness: 2px;
    }

    .delete-btn {
      flex: none;
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #cbd5e1;
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 10px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: #fff1f2;
    }

    @media (hover: none) {
      .delete-btn { color: #b6c0d0; }
    }

    .task-actions {
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 9px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .edit-btn svg { flex: none; }

    .edit-btn:hover {
      color: var(--brand);
      background: #eef2ff;
    }

    .task.is-editing {
      grid-template-columns: 1fr;
    }

    .task.is-editing > .check,
    .task.is-editing > .task-actions {
      display: none;
    }

    .task.shake { animation: shake 0.35s ease; }

    .edit-box {
      display: grid;
      gap: 9px;
    }

    .edit-input {
      width: 100%;
      padding: 11px 13px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #c7c9f8;
      border-radius: 12px;
      outline: none;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .edit-save,
    .edit-cancel {
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      transition: filter 0.15s ease, background 0.2s ease, transform 0.15s ease;
    }

    .edit-save {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: none;
      box-shadow: 0 8px 16px -10px rgba(79, 70, 229, 0.9);
    }

    .edit-save:hover { filter: brightness(1.08); }

    .edit-cancel {
      color: var(--muted);
      background: #f1f5f9;
      border: 1px solid var(--line);
    }

    .edit-cancel:hover {
      color: var(--ink);
      background: #e9eef6;
    }

    .edit-save:active,
    .edit-cancel:active { transform: translateY(1px) scale(0.99); }

    /* ---------- Trạng thái trống ---------- */
    .empty {
      margin-top: 18px;
      padding: 38px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
      border: 1px dashed #d8e0ef;
      border-radius: 18px;
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      color: var(--brand);
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      border-radius: 18px;
    }

    .empty h2 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .empty p {
      max-width: 300px;
      margin: 0 auto;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* ---------- Chân trang / toast ---------- */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 26px;
      font-size: 12.5px;
      color: var(--muted-soft);
    }

    .footer svg { flex: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: #fff;
      background: #0f172a;
      border-radius: 12px;
      box-shadow: 0 18px 40px -14px rgba(15, 23, 42, 0.8);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast svg { flex: none; color: var(--green-bright); }

    @keyframes taskIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes taskOut {
      to { opacity: 0; transform: translateX(14px) scale(0.97); }
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    @media (max-width: 480px) {
      body { padding: 24px 14px 40px; }

      h1 { font-size: 26px; }

      .logo { width: 46px; height: 46px; border-radius: 14px; }

      .stats { padding: 16px 14px 18px; }

      .stat-value { font-size: 21px; }

      .add-btn { padding: 0 14px; }

      .filter-btn { padding: 8px 10px; font-size: 13px; }

      .task { padding: 12px; gap: 10px; }

      .task-text { font-size: 14.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </div>
        <div>
          <p class="eyebrow" id="today">Hôm nay</p>
          <h1>Việc của tôi</h1>
        </div>
      </div>
      <p class="subtitle">Ghi lại việc cần làm, hoàn thành từng việc nhỏ mỗi ngày.</p>
    </header>

    <section class="stats" aria-label="Tiến độ công việc">
      <div class="stats-row">
        <div class="stat">
          <span class="stat-value" id="statActive">0</span>
          <span class="stat-label">Đang làm</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat stat--done">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">Hoàn thành</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat stat--percent">
          <span class="stat-value" id="statPercent">0%</span>
          <span class="stat-label">Tiến độ</span>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Tiến độ hoàn thành" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <form class="add-form" id="taskForm" autocomplete="off">
      <label class="visually-hidden" for="taskInput" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">Tên công việc mới</label>
      <input
        class="add-input"
        id="taskInput"
        type="text"
        maxlength="200"
        placeholder="Bạn cần làm gì hôm nay?"
        enterkeyhint="done"
      />
      <button class="add-btn" type="submit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Thêm
      </button>
    </form>

    <div class="search-box" role="search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.4-3.4" />
      </svg>
      <input
        class="search-input"
        id="searchInput"
        type="search"
        placeholder="Tìm công việc theo tên…"
        autocomplete="off"
        enterkeyhint="search"
        aria-label="Tìm công việc theo tên"
      />
      <button class="search-clear" type="button" id="searchClear" aria-label="Xóa từ khóa tìm kiếm" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Lọc công việc">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">
          Tất cả <span class="filter-count">0</span>
        </button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">
          Đang làm <span class="filter-count">0</span>
        </button>
        <button class="filter-btn" type="button" data-filter="done" aria-pressed="false">
          Đã xong <span class="filter-count">0</span>
        </button>
      </div>
      <button class="clear-btn" type="button" id="clearDone" hidden>Xóa việc đã xong</button>
    </div>

    <ul class="task-list" id="taskList" aria-live="polite"></ul>

    <div class="empty" id="emptyState" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
          <rect x="9" y="3" width="6" height="4" rx="1" />
          <path d="M9 12h6M9 16h4" />
        </svg>
      </div>
      <h2 id="emptyTitle">Chưa có công việc nào</h2>
      <p id="emptyText">Thêm việc đầu tiên để bắt đầu một ngày thật gọn gàng.</p>
    </div>

    <p class="footer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      Tự động lưu trên thiết bị này
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6L9 17l-5-5" />
    </svg>
    <span id="toastText"></span>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "quan-ly-cong-viec.v1";
      var MAX_LENGTH = 200;

      var form = document.getElementById("taskForm");
      var input = document.getElementById("taskInput");
      var searchInput = document.getElementById("searchInput");
      var searchClear = document.getElementById("searchClear");
      var list = document.getElementById("taskList");
      var filters = document.getElementById("filters");
      var clearDoneBtn = document.getElementById("clearDone");
      var emptyState = document.getElementById("emptyState");
      var emptyTitle = document.getElementById("emptyTitle");
      var emptyText = document.getElementById("emptyText");
      var statActive = document.getElementById("statActive");
      var statDone = document.getElementById("statDone");
      var statPercent = document.getElementById("statPercent");
      var progressFill = document.getElementById("progressFill");
      var progressTrack = document.getElementById("progressTrack");
      var toast = document.getElementById("toast");
      var toastText = document.getElementById("toastText");

      var CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
      var TRASH_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
      var EDIT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

      var tasks = loadTasks();
      var filter = "all";
      var searchQuery = "";
      var highlightId = null;
      var editingId = null;
      var editingDraft = null;
      var toastTimer = null;

      function makeId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function loadTasks() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];
          return data
            .filter(function (item) {
              return item && typeof item.text === "string" && item.text.trim() !== "";
            })
            .map(function (item) {
              return {
                id: typeof item.id === "string" && item.id ? item.id : makeId(),
                text: item.text.slice(0, MAX_LENGTH),
                done: Boolean(item.done),
                createdAt: Number(item.createdAt) || Date.now()
              };
            });
        } catch (error) {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          /* Bộ nhớ trình duyệt có thể bị đầy hoặc bị chặn. */
        }
      }

      function normalizeText(value) {
        var text = String(value).toLowerCase();
        if (typeof text.normalize === "function") {
          text = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }
        return text.replace(/đ/g, "d");
      }

      function getSearchTerms() {
        return normalizeText(searchQuery).trim().split(/\s+/).filter(Boolean);
      }

      function matchesSearch(task, terms) {
        if (!terms.length) return true;
        var text = normalizeText(task.text);
        return terms.every(function (term) {
          return text.indexOf(term) !== -1;
        });
      }

      function getVisibleTasks() {
        var visible = tasks;

        if (filter === "active") {
          visible = visible.filter(function (task) { return !task.done; });
        } else if (filter === "done") {
          visible = visible.filter(function (task) { return task.done; });
        }

        var terms = getSearchTerms();
        if (terms.length) {
          visible = visible.filter(function (task) {
            return matchesSearch(task, terms);
          });
        }

        return visible;
      }

      function escapeSelector(value) {
        if (window.CSS && typeof window.CSS.escape === "function") {
          return window.CSS.escape(value);
        }
        return String(value).replace(/["\\]/g, "\\$&");
      }

      function createTaskElement(task) {
        var isEditing = task.id === editingId;

        var li = document.createElement("li");
        li.className = "task" + (task.done ? " is-done" : "") + (task.id === highlightId ? " is-new" : "") + (isEditing ? " is-editing" : "");
        li.dataset.id = task.id;

        if (isEditing) {
          var editBox = document.createElement("div");
          editBox.className = "edit-box";

          var editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.maxLength = MAX_LENGTH;
          editInput.autocomplete = "off";
          editInput.value = editingDraft !== null ? editingDraft : task.text;
          editInput.setAttribute("aria-label", "Tên công việc");

          var editActions = document.createElement("div");
          editActions.className = "edit-actions";

          var saveBtn = document.createElement("button");
          saveBtn.type = "button";
          saveBtn.className = "edit-save";
          saveBtn.dataset.action = "save-edit";
          saveBtn.textContent = "Lưu";

          var cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "edit-cancel";
          cancelBtn.dataset.action = "cancel-edit";
          cancelBtn.textContent = "Hủy";

          editActions.appendChild(saveBtn);
          editActions.appendChild(cancelBtn);
          editBox.appendChild(editInput);
          editBox.appendChild(editActions);
          li.appendChild(editBox);
          return li;
        }

        var check = document.createElement("button");
        check.type = "button";
        check.className = "check";
        check.dataset.action = "toggle";
        check.setAttribute("aria-pressed", String(task.done));
        check.setAttribute("aria-label", task.done ? "Bỏ đánh dấu hoàn thành" : "Đánh dấu hoàn thành");
        check.innerHTML = CHECK_SVG;

        var text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        var actions = document.createElement("div");
        actions.className = "task-actions";

        var edit = document.createElement("button");
        edit.type = "button";
        edit.className = "edit-btn";
        edit.dataset.action = "edit";
        edit.setAttribute("aria-label", "Sửa công việc: " + task.text);
        edit.innerHTML = EDIT_SVG + "<span>Sửa</span>";

        var del = document.createElement("button");
        del.type = "button";
        del.className = "delete-btn";
        del.dataset.action = "delete";
        del.setAttribute("aria-label", "Xóa công việc: " + task.text);
        del.innerHTML = TRASH_SVG;

        actions.appendChild(edit);
        actions.appendChild(del);
        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(actions);
        return li;
      }

      function render() {
        if (editingId && !tasks.some(function (task) { return task.id === editingId; })) {
          editingId = null;
          editingDraft = null;
        }

        var total = tasks.length;
        var done = tasks.filter(function (task) { return task.done; }).length;
        var active = total - done;
        var percent = total ? Math.round((done / total) * 100) : 0;

        statActive.textContent = String(active);
        statDone.textContent = String(done);
        statPercent.textContent = percent + "%";
        progressFill.style.width = percent + "%";
        progressTrack.setAttribute("aria-valuenow", String(percent));

        filters.querySelectorAll("[data-filter]").forEach(function (button) {
          var key = button.dataset.filter;
          var isActive = key === filter;
          button.setAttribute("aria-pressed", String(isActive));

          var count = button.querySelector(".filter-count");
          if (count) {
            count.textContent = String(key === "all" ? total : key === "active" ? active : done);
          }
        });

        clearDoneBtn.hidden = done === 0;
        searchClear.hidden = searchQuery === "";

        var visible = getVisibleTasks();
        list.textContent = "";

        var fragment = document.createDocumentFragment();
        visible.forEach(function (task) {
          fragment.appendChild(createTaskElement(task));
        });
        list.appendChild(fragment);

        var isEmpty = visible.length === 0;
        emptyState.hidden = !isEmpty;

        if (isEmpty) {
          if (searchQuery.trim()) {
            var shownQuery = searchQuery.trim().slice(0, 60);
            if (searchQuery.trim().length > 60) shownQuery += "…";
            emptyTitle.textContent = "Không tìm thấy công việc";
            emptyText.textContent = "Không có công việc nào khớp với “" + shownQuery + "”.";
          } else if (filter === "active") {
            emptyTitle.textContent = "Không còn việc nào đang làm";
            emptyText.textContent = "Tuyệt vời! Bạn đã hoàn thành tất cả công việc rồi.";
          } else if (filter === "done") {
            emptyTitle.textContent = "Chưa có việc nào hoàn thành";
            emptyText.textContent = "Đánh dấu vào ô tròn khi bạn làm xong một việc nhé.";
          } else {
            emptyTitle.textContent = "Chưa có công việc nào";
            emptyText.textContent = "Thêm việc đầu tiên để bắt đầu một ngày thật gọn gàng.";
          }
        }
      }

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("is-visible");
        }, 2000);
      }

      function focusTaskCheck(id) {
        var check = list.querySelector('.task[data-id="' + escapeSelector(id) + '"] .check');
        if (check) {
          check.focus();
          return;
        }
        if (searchQuery.trim()) {
          searchInput.focus();
          return;
        }
        var activeFilter = filters.querySelector('[data-filter="' + filter + '"]');
        if (activeFilter) activeFilter.focus();
      }

      function focusTaskAction(id, action) {
        var button = list.querySelector('.task[data-id="' + escapeSelector(id) + '"] button[data-action="' + action + '"]');
        if (button) {
          button.focus();
          return;
        }
        if (searchQuery.trim()) {
          searchInput.focus();
          return;
        }
        var activeFilter = filters.querySelector('[data-filter="' + filter + '"]');
        if (activeFilter) activeFilter.focus();
      }

      function focusEditInput(id) {
        var field = list.querySelector('.task[data-id="' + escapeSelector(id) + '"] .edit-input');
        if (!field) return;
        field.focus();
        field.select();
      }

      function cancelEdit(id) {
        editingId = null;
        editingDraft = null;
        render();
        focusTaskAction(id, "edit");
      }

      function saveEdit(item, id) {
        var task = tasks.find(function (entry) { return entry.id === id; });
        var field = item.querySelector(".edit-input");
        if (!task || !field) return;

        var text = field.value.trim();
        if (!text) {
          item.classList.remove("shake");
          void item.offsetWidth;
          item.classList.add("shake");
          window.setTimeout(function () { item.classList.remove("shake"); }, 400);
          field.focus();
          showToast("Tên công việc không được để trống");
          return;
        }

        var newText = text.slice(0, MAX_LENGTH);
        var changed = newText !== task.text;

        editingId = null;
        editingDraft = null;

        if (changed) {
          task.text = newText;
          saveTasks();
          showToast("Đã cập nhật tên công việc");
        }

        render();
        focusTaskAction(id, "edit");
      }

      function clearSearch(shouldFocus) {
        searchQuery = "";
        searchInput.value = "";
        searchClear.hidden = true;
        if (shouldFocus) searchInput.focus();
      }

      searchInput.addEventListener("input", function () {
        searchQuery = searchInput.value;

        if (editingId) {
          var editingTask = tasks.find(function (task) { return task.id === editingId; });
          if (editingTask && !matchesSearch(editingTask, getSearchTerms())) {
            editingId = null;
            editingDraft = null;
          }
        }

        render();
      });

      searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && searchQuery !== "") {
          event.preventDefault();
          clearSearch(true);
          render();
        }
      });

      searchClear.addEventListener("click", function () {
        clearSearch(true);
        render();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = input.value.trim();

        if (!text) {
          form.classList.remove("shake");
          void form.offsetWidth;
          form.classList.add("shake");
          window.setTimeout(function () { form.classList.remove("shake"); }, 400);
          input.focus();
          return;
        }

        var task = {
          id: makeId(),
          text: text.slice(0, MAX_LENGTH),
          done: false,
          createdAt: Date.now()
        };

        tasks.unshift(task);
        highlightId = task.id;
        saveTasks();

        input.value = "";
        if (filter === "done") filter = "all";
        clearSearch(false);
        render();
        highlightId = null;

        input.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      list.addEventListener("click", function (event) {
        var button = event.target.closest("button[data-action]");
        if (!button) return;

        var item = button.closest(".task");
        if (!item || item.dataset.removing === "1") return;

        var id = item.dataset.id;
        var task = tasks.find(function (entry) { return entry.id === id; });
        if (!task) return;

        var action = button.dataset.action;

        if (action === "edit") {
          editingId = id;
          editingDraft = null;
          render();
          focusEditInput(id);
          return;
        }

        if (action === "cancel-edit") {
          cancelEdit(id);
          return;
        }

        if (action === "save-edit") {
          saveEdit(item, id);
          return;
        }

        if (action === "toggle") {
          task.done = !task.done;
          saveTasks();
          render();
          focusTaskCheck(id);
          return;
        }

        if (action === "delete") {
          if (editingId === id) {
            editingId = null;
            editingDraft = null;
          }
          item.dataset.removing = "1";
          item.classList.add("is-removing");
          window.setTimeout(function () {
            tasks = tasks.filter(function (entry) { return entry.id !== id; });
            saveTasks();
            render();
            showToast("Đã xóa công việc");
          }, 180);
        }
      });

      list.addEventListener("input", function (event) {
        if (event.target.classList.contains("edit-input")) {
          editingDraft = event.target.value;
        }
      });

      list.addEventListener("keydown", function (event) {
        var field = event.target;
        if (!field.classList || !field.classList.contains("edit-input")) return;
        if (event.isComposing || event.keyCode === 229) return;

        var item = field.closest(".task");
        if (!item) return;

        if (event.key === "Enter") {
          event.preventDefault();
          saveEdit(item, item.dataset.id);
        } else if (event.key === "Escape") {
          event.preventDefault();
          cancelEdit(item.dataset.id);
        }
      });

      filters.addEventListener("click", function (event) {
        var button = event.target.closest("[data-filter]");
        if (!button) return;
        filter = button.dataset.filter;
        render();
      });

      clearDoneBtn.addEventListener("click", function () {
        var doneCount = tasks.filter(function (task) { return task.done; }).length;
        if (!doneCount) return;

        var message = "Xóa " + doneCount + " công việc đã hoàn thành?";
        if (!window.confirm(message)) return;

        tasks = tasks.filter(function (task) { return !task.done; });
        saveTasks();
        render();
        showToast("Đã dọn dẹp việc hoàn thành");
      });

      window.addEventListener("storage", function (event) {
        if (event.key !== STORAGE_KEY) return;
        tasks = loadTasks();
        render();
      });

      (function setToday() {
        var today = document.getElementById("today");
        try {
          var now = new Date();
          var weekday = new Intl.DateTimeFormat("vi-VN", { weekday: "long" }).format(now);
          var date = new Intl.DateTimeFormat("vi-VN", { day: "numeric", month: "long" }).format(now);
          today.textContent = weekday + ", " + date;
        } catch (error) {
          today.textContent = "Hôm nay";
        }
      })();

      render();
    })();
  </script>
</body>
</html>
